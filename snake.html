<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Courier New', monospace;
        }
        .game-container {
            text-align: center;
            color: white;
        }
        canvas {
            border: 2px solid #4CAF50;
            background-color: #0a0a0a;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        .score {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4CAF50;
        }
        .game-over {
            font-size: 32px;
            color: #ff4444;
            margin-top: 10px;
        }
        .controls {
            margin-top: 20px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score">Score: <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">Use arrow keys to control the snake</div>
        <div id="gameOver" class="game-over" style="display: none;">Game Over!</div>
    </div>

    <script>
        // Game constants
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const INITIAL_SPEED = 150;
        
        // Game variables
        let snake = [];
        let direction = { x: 1, y: 0 };
        let food = {};
        let score = 0;
        let gameRunning = false;
        let gameSpeed = INITIAL_SPEED;

        // Canvas setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const gameOverElement = document.getElementById('gameOver');

        // Initialize game
        function initGame() {
            // Create snake with 3 segments
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            score = 0;
            gameSpeed = INITIAL_SPEED;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            scoreElement.textContent = score;
            generateFood();
            gameLoop();
        }

        // Generate food at random position
        function generateFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (isSnakePosition(food.x, food.y));
        }

        // Check if position is occupied by snake
        function isSnakePosition(x, y) {
            return snake.some(segment => segment.x === x && segment.y === y);
        }

        // Move snake
        function moveSnake() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // Check wall collision
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                gameOver();
                return;
            }
            
            // Check self collision
            if (isSnakePosition(head.x, head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            // Check if food is eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
                // Increase speed
                gameSpeed = Math.max(50, gameSpeed - 5);
            } else {
                snake.pop();
            }
        }

        // Draw game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw snake
            ctx.fillStyle = '#4CAF50';
            snake.forEach((segment, index) => {
                ctx.fillRect(
                    segment.x * CELL_SIZE, 
                    segment.y * CELL_SIZE, 
                    CELL_SIZE - 2, 
                    CELL_SIZE - 2
                );
            });
            
            // Draw food
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(
                food.x * CELL_SIZE, 
                food.y * CELL_SIZE, 
                CELL_SIZE - 2, 
                CELL_SIZE - 2
            );
        }

        // Game over
        function gameOver() {
            gameRunning = false;
            gameOverElement.style.display = 'block';
        }

        // Main game loop
        function gameLoop() {
            if (!gameRunning) return;
            
            moveSnake();
            draw();
            
            setTimeout(gameLoop, gameSpeed);
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.key === ' ') {
                initGame();
                return;
            }
            
            switch (e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) {
                        direction = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) {
                        direction = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) {
                        direction = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) {
                        direction = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // Start the game
        initGame();
    </script>
</body>
</html>
